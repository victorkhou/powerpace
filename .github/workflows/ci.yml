name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          # next build evaluates client env at compile time; provide harmless
          # placeholders so the build doesn't fail on missing public vars.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  coach:
    name: coach sidecar (pytest)
    runs-on: ubuntu-latest
    # Hermetic: the agent/ tests mock Supabase, Anthropic, and LangSmith, so this
    # needs no secrets, no DB, and no network — it always runs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r agent/requirements.txt
      - name: Run coach unit tests
        run: pytest
        working-directory: agent

  integration:
    name: integration (log_session RPC)
    runs-on: ubuntu-latest
    # Only runs when the repo has Supabase secrets configured. Skips cleanly on
    # forks / PRs without secrets instead of failing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run integration tests
        run: npm run test:integration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
